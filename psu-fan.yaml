# ============================================================================
#  ESP32 风扇调压控制器 (ESP32-WROOM-32E + ESPHome)
#  - PWM: GPIO17, LEDC 18kHz；占空比 40%~80% 映射到 1%~100% 风速
#  - 控制: Home Assistant 原生 API（加密） + MQTT（供 App/第三方直连）
#  - 定时: 6 个星期规则槽 + 设备端倒计时，掉电保存，不依赖手机
#  - 可靠性: 静态 IP、关闭 api reboot_timeout、关闭 WiFi 省电、fast_connect
#  - 诊断: wifi_ip / reset_reason / dev_time / 5 秒 retained 状态快照
#  凭据与网络参数全部通过 secrets.yaml 注入，见 secrets.yaml.example
# ============================================================================
esphome:
  name: psu-fan-32
  friendly_name: 电源风扇调压32

  # 开机先把 PWM 占空比拉到 0，避免上电瞬间风扇乱转
  on_boot:
    priority: 900
    then:
      - output.set_level:
          id: fan_map
          level: 0.0

esp32:
  board: esp32dev             # ESP32-WROOM-32E 开发板 (DevKitC 通用配置)
  framework:
    type: arduino             # 本机无 cmake, 用 Arduino 框架编译

logger:

# 提供复位原因等诊断信息（配合 text_sensor.debug 使用）
debug:
  update_interval: 60s

api:
  # 关闭"无客户端接入则重启"的默认值(15min)：否则 HA 一旦连不上，设备会反复重启换 IP
  reboot_timeout: 0s
  encryption:
    key: !secret fan_api_key

# ---- MQTT: 供安卓 App 直连 broker 控制 ----
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: fan32
  discovery: false        # HA 走 API 集成, 不重复注册 MQTT 实体
  log_topic: null         # 关闭日志话题, 减少流量

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 固定 IP：避免 DHCP 换址后 HA 的 ESPHome 集成指向旧地址（本网 mDNS 不生效，无法自动纠正）
  manual_ip:
    static_ip: !secret device_ip
    gateway: !secret gateway_ip
    subnet: 255.255.255.0
    dns1: 223.5.5.5
    dns2: 114.114.114.114
  fast_connect: true        # 开机直连已存 SSID，跳过扫描，缩短断线恢复时间
  power_save_mode: none     # 关闭 WiFi 省电，避免 TCP 长连接被挂起导致 API/MQTT "假死"
  # WiFi 连不上时自动开热点，手机连上即可重新配网
  ap:
    ssid: "psu-fan-32-fallback"

captive_portal:

# ==========================================================================
# 设备端定时（不依赖手机/APP）
#   规则字符串格式:  HH:MM|DAYS|ACTION|SPEED
#     DAYS   : 1-7 的数字组合（1=周一 … 7=周日），或 * 表示每天
#     ACTION : ON / OFF / SPEED
#     SPEED  : 1-100（仅 SPEED 动作使用）
#     空串或 "0" = 该槽停用
#   6 个槽通过 MQTT text 实体写入并保存在 flash，重启不丢
# ==========================================================================
globals:
  - id: cd_end
    type: uint32_t
    restore_value: true
    initial_value: "0"

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Shanghai
    servers:
      - ntp.aliyun.com
      - ntp1.aliyun.com
      - time1.cloud.tencent.com
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              auto t = id(sntp_time).now();
              if (!t.is_valid()) {
                ESP_LOGW("rule", "time not synced, skip");
                return;
              }
              const int iso = (t.day_of_week == 1) ? 7 : (t.day_of_week - 1);
              auto run = [&](const std::string &s) {
                if (s.size() < 5 || s == "0") return;
                size_t p1 = s.find('|');
                if (p1 == std::string::npos) return;
                size_t p2 = s.find('|', p1 + 1);
                if (p2 == std::string::npos) return;
                size_t p3 = s.find('|', p2 + 1);
                std::string tstr = s.substr(0, p1);
                std::string dstr = s.substr(p1 + 1, p2 - p1 - 1);
                std::string astr = s.substr(p2 + 1, (p3 == std::string::npos ? s.size() : p3) - p2 - 1);
                std::string sstr = (p3 == std::string::npos) ? "" : s.substr(p3 + 1);
                if (tstr.size() < 5 || tstr[2] != ':') return;
                int hh = atoi(tstr.substr(0, 2).c_str());
                int mm = atoi(tstr.substr(3, 2).c_str());
                if (hh != t.hour || mm != t.minute) return;
                bool day_ok = (dstr == "*");
                if (!day_ok) {
                  for (char c : dstr) {
                    if ((c - '0') == iso) { day_ok = true; break; }
                  }
                }
                if (!day_ok) return;
                int spd = sstr.empty() ? 60 : atoi(sstr.c_str());
                auto call = id(fan1).make_call();
                if (astr == "OFF") {
                  call.set_state(false);
                } else {
                  call.set_state(true);
                  if (astr == "SPEED") call.set_speed(constrain(spd, 1, 100));
                }
                call.perform();
                ESP_LOGI("rule", "fire: %s", s.c_str());
              };
              run(id(rule1).state);
              run(id(rule2).state);
              run(id(rule3).state);
              run(id(rule4).state);
              run(id(rule5).state);
              run(id(rule6).state);

# ---- 6 个定时规则槽（MQTT: fan32/text/ruleN/command，状态 fan32/text/ruleN/state） ----
text:
  - platform: template
    id: rule1
    name: "rule1"
    icon: "mdi:calendar-clock"
    optimistic: true
    mode: TEXT
    max_length: 24
    restore_value: true
    initial_value: ""
  - platform: template
    id: rule2
    name: "rule2"
    icon: "mdi:calendar-clock"
    optimistic: true
    mode: TEXT
    max_length: 24
    restore_value: true
    initial_value: ""
  - platform: template
    id: rule3
    name: "rule3"
    icon: "mdi:calendar-clock"
    optimistic: true
    mode: TEXT
    max_length: 24
    restore_value: true
    initial_value: ""
  - platform: template
    id: rule4
    name: "rule4"
    icon: "mdi:calendar-clock"
    optimistic: true
    mode: TEXT
    max_length: 24
    restore_value: true
    initial_value: ""
  - platform: template
    id: rule5
    name: "rule5"
    icon: "mdi:calendar-clock"
    optimistic: true
    mode: TEXT
    max_length: 24
    restore_value: true
    initial_value: ""
  - platform: template
    id: rule6
    name: "rule6"
    icon: "mdi:calendar-clock"
    optimistic: true
    mode: TEXT
    max_length: 24
    restore_value: true
    initial_value: ""
  # ---- 固定命令通道（ASCII 名 → 主题 fan32/text/cmd/command 可预测）----
  # 载荷: on | off | speed 60
  - platform: template
    id: cmd_text
    name: "cmd"
    icon: "mdi:remote"
    optimistic: false
    mode: TEXT
    max_length: 16
    initial_value: ""
    set_action:
      - lambda: |-
          std::string s = x;
          while (!s.empty() && (s.front() == ' ' )) s.erase(0, 1);
          while (!s.empty() && (s.back() == ' ')) s.pop_back();
          auto call = id(fan1).make_call();
          if (s == "on" || s == "ON") {
            call.set_state(true);
          } else if (s == "off" || s == "OFF") {
            call.set_state(false);
          } else if (s.rfind("speed", 0) == 0) {
            int v = atoi(s.c_str() + 5);
            call.set_state(true);
            call.set_speed(constrain(v, 1, 100));
          } else {
            ESP_LOGW("cmd", "unknown cmd: %s", s.c_str());
            return;
          }
          call.perform();
          ESP_LOGI("cmd", "exec: %s", s.c_str());

  # 倒计时到点动作: ON / OFF
  - platform: template
    id: cd_action
    name: "cd_action"
    icon: "mdi:timer-cog"
    optimistic: true
    mode: TEXT
    max_length: 4
    restore_value: true
    initial_value: "OFF"

number:
  - platform: template
    id: cd_minutes
    name: "cd_minutes"
    icon: "mdi:timer-sand"
    optimistic: true
    min_value: 1
    max_value: 1440
    step: 1
    initial_value: 30

button:
  - platform: template
    id: cd_start
    name: "cd_start"
    icon: "mdi:timer-play"
    on_press:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (!t.is_valid()) {
            ESP_LOGW("cd", "time not synced, cannot start");
            return;
          }
          int mins = (int) id(cd_minutes).state;
          if (mins < 1) mins = 1;
          id(cd_end) = (uint32_t) ((int64_t) t.timestamp + (int64_t) mins * 60);
          ESP_LOGI("cd", "start %d min, action=%s", mins, id(cd_action).state.c_str());
  - platform: template
    id: cd_cancel
    name: "cd_cancel"
    icon: "mdi:timer-off"
    on_press:
      - lambda: |-
          id(cd_end) = 0;
          ESP_LOGI("cd", "cancelled");

text_sensor:
  # 设备当前 IP（HA/App 都能看到，排障关键：IP 漂移是 HA 掉线的头号原因）
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "wifi_ip"
      icon: "mdi:ip-network"
    ssid:
      name: "wifi_ssid"
  # 复位原因：brownout=电源跌落 / power_on=断电重上 / software=程序重启
  - platform: debug
    reset_reason:
      id: reset_reason
      name: "reset_reason"
      icon: "mdi:restart-alert"
  - platform: template
    id: dev_time
    name: "dev_time"
    icon: "mdi:clock-outline"
    update_interval: 15s
    lambda: |-
      auto t = id(sntp_time).now();
      if (!t.is_valid()) return std::string("--unsynced--");
      char buf[32];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d:%02d",
               t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
      return std::string(buf);

sensor:
  - platform: template
    id: cd_remaining
    name: "cd_remaining"
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 3s
    lambda: |-
      if (id(cd_end) == 0) return 0.0f;
      auto t = id(sntp_time).now();
      if (!t.is_valid()) return 0.0f;
      int64_t r = (int64_t) id(cd_end) - (int64_t) t.timestamp;
      return r > 0 ? (float) r : 0.0f;

interval:
  # 每 20 秒刷新 retained 状态快照（含规则与倒计时），保证 App 冷启动可读到全量状态
  - interval: 5s
    then:
      - mqtt.publish:
          topic: fan32/state
          retain: true
          qos: 0
          payload: !lambda |-
            char buf[320];
            snprintf(buf, sizeof(buf),
              "{\"on\":%s,\"speed\":%d,\"rules\":[\"%s\",\"%s\",\"%s\",\"%s\",\"%s\",\"%s\"],\"cd_action\":\"%s\",\"cd_rem\":%d,\"ip\":\"%s\",\"up\":%d}",
              id(fan1).state ? "true" : "false", id(fan1).speed,
              id(rule1).state.c_str(), id(rule2).state.c_str(), id(rule3).state.c_str(),
              id(rule4).state.c_str(), id(rule5).state.c_str(), id(rule6).state.c_str(),
              id(cd_action).state.c_str(), (int) id(cd_remaining).state,
              id(wifi_ip).state.c_str(), (int) (millis() / 1000));
            return std::string(buf);
  - interval: 3s
    then:
      - lambda: |-
          if (id(cd_end) == 0) return;
          auto t = id(sntp_time).now();
          if (!t.is_valid()) return;
          if ((int64_t) t.timestamp >= (int64_t) id(cd_end)) {
            bool on = (id(cd_action).state == "ON");
            auto call = id(fan1).make_call();
            call.set_state(on);
            call.perform();
            id(cd_end) = 0;
            ESP_LOGI("cd", "countdown done -> %s", on ? "ON" : "OFF");
          }

output:
  # ---- PWM 输出：GPIO17 = LEDC 硬件 PWM, 18kHz ----
  - platform: ledc
    pin: GPIO17
    id: pwm_out
    frequency: 18kHz

  # ---- 转速→占空比 标定层 (双MOS模块 + 新风扇, 输入12V, 实测) ----
  # 实测: 占空比40%→4.75V, 50%→5.78V, 80%→9.50V (输出 ≈ 占空比×12V, 近似线性)
  # 目标: 滑块1%→4.75V, 100%→9.50V → 占空比 40%→80% 线性映射
  - platform: template
    id: fan_map
    type: float
    write_action:
      - lambda: |-
          float s = constrain(state, 0.0f, 1.0f);
          float duty;
          if (s <= 0.001f) {
            duty = 0.0f;                              // 0% = 关断, 引脚恒低
          } else {
            duty = 0.4000f + (s - 0.01f) * 0.40404f;  // 1%→40%, 100%→80%
          }
          id(pwm_out).set_level(constrain(duty, 0.0f, 1.0f));

# ---- HA 风扇实体: 开关 + 0-100% 转速滑块 ----
fan:
  - platform: speed
    id: fan1
    name: "风扇"
    icon: "mdi:fan"
    output: fan_map
    speed_count: 100          # 滑块 1% 步进
    restore_mode: RESTORE_DEFAULT_OFF
    # 从"关"切到"开"时若没有档位记录，自动给 1%
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(fan1).speed == 0;'
          then:
            - fan.turn_on:
                id: fan1
                speed: 1
    # 关扇时确保 PWM 占空比归零 (引脚恒低 = 真 0V)
    on_turn_off:
      - output.set_level:
          id: fan_map
          level: 0.0
    # 状态变化立即发布 retained 快照，App 冷启动可立刻拿到真实状态
    on_state:
      - mqtt.publish:
          topic: fan32/state
          retain: true
          qos: 0
          payload: !lambda |-
            char buf[320];
            snprintf(buf, sizeof(buf),
              "{\"on\":%s,\"speed\":%d,\"rules\":[\"%s\",\"%s\",\"%s\",\"%s\",\"%s\",\"%s\"],\"cd_action\":\"%s\",\"cd_rem\":%d,\"ip\":\"%s\",\"up\":%d}",
              id(fan1).state ? "true" : "false", id(fan1).speed,
              id(rule1).state.c_str(), id(rule2).state.c_str(), id(rule3).state.c_str(),
              id(rule4).state.c_str(), id(rule5).state.c_str(), id(rule6).state.c_str(),
              id(cd_action).state.c_str(), (int) id(cd_remaining).state,
              id(wifi_ip).state.c_str(), (int) (millis() / 1000));
            return std::string(buf);